[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-research"
version = "0.1.0"
description = "Measured experiments for memory-constrained MoE inference"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "psutil>=6.0"]

[project.optional-dependencies]
codecs = ["lz4>=4.4", "zstandard>=0.23"]

[project.scripts]
apex = "apex.cli:main"

[tool.setuptools.packages.find]
include = ["apex*"]
